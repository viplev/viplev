info:
  name: /v1/environments/:id - Get an environment
  type: http
  seq: 3

http:
  method: GET
  url: "{{http_url}}/v1/environments/:environmentId"
  params:
    - name: environmentId
      value: "{{environment_id}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let data = res.body;
        bru.setEnvVar('agent_access_token', data.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
