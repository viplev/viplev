info:
  name: /v1/environments/:id/services - Get all services on an Environment
  type: http
  seq: 6

http:
  method: GET
  url: "{{http_url}}/v1/environments/:environmentId/services"
  params:
    - name: environmentId
      value: "{{environment_id}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
