info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/v1/auth/login
  body:
    type: json
    data: |-
      {
        "email": "user1@viplev.dk",
        "password": "password"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        let data = res.body;
        bru.setEnvVar('access_token', data.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
