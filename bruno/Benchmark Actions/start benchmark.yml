info:
  name: /v1/environments/:id/benchmarks/:id/start - Start a benchmark
  type: http
  seq: 1

http:
  method: POST
  url: "{{http_url}}/v1/environments/:environmentId/benchmarks/:benchmarkId/start"
  params:
    - name: environmentId
      value: "{{environment_id}}"
      type: path
    - name: benchmarkId
      value: "{{benchmark_id}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let data = res.body;
        bru.setEnvVar('run_id', data.runId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
