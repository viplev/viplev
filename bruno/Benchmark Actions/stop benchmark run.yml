info:
  name: /v1/environments/:id/benchmarks/:id/runs/:id/stop - Stop a benchmark run
  type: http
  seq: 2

http:
  method: POST
  url: "{{http_url}}/v1/environments/:environmentId/benchmarks/:benchmarkId/runs/:runId/stop"
  params:
    - name: environmentId
      value: "{{environment_id}}"
      type: path
    - name: benchmarkId
      value: "{{benchmark_id}}"
      type: path
    - name: runId
      value: "{{run_id}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
