info:
  name: /v1/environments/:id/benchmarks/:id/runs/:id/raw - Get raw data for a run
  type: http
  seq: 5

http:
  method: GET
  url: "{{http_url}}/v1/environments/:environmentId/benchmarks/:benchmarkId/runs/:runId/raw"
  params:
    - name: environmentId
      value: "{{environment_id}}"
      type: path
    - name: benchmarkId
      value: "{{benchmark_id}}"
      type: path
    - name: runId
      value: "{{run_id}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
