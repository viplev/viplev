info:
  name: /v1/environments/:id/benchmarks/:id/runs/:id - Get a run
  type: http
  seq: 3

http:
  method: GET
  url: "{{http_url}}/v1/environments/:environmentId/benchmarks/:benchmarkId/runs/:runId"
  params:
    - name: environmentId
      value: "{{environment_id}}"
      type: path
    - name: benchmarkId
      value: "{{benchmark_id}}"
      type: path
    - name: runId
      value: "{{run_id}}"
      type: path
    - name: percentiles
      value: "p90,p95"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
