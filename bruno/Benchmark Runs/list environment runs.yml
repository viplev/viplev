info:
  name: /v1/environments/:id/runs - Get all runs across benchmarks for an environment
  type: http
  seq: 1

http:
  method: GET
  url: "{{http_url}}/v1/environments/:environmentId/runs"
  params:
    - name: environmentId
      value: "{{environment_id}}"
      type: path
    - name: page
      value: "0"
      type: query
    - name: size
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
