info:
  name: /v1/environments/:id/benchmarks/:id/runs - Get all runs for a benchmark
  type: http
  seq: 2

http:
  method: GET
  url: "{{http_url}}/v1/environments/:environmentId/benchmarks/:benchmarkId/runs"
  params:
    - name: environmentId
      value: "{{environment_id}}"
      type: path
    - name: benchmarkId
      value: "{{benchmark_id}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let data = res.body;
        if (Array.isArray(data) && data.length > 0) {
          bru.setEnvVar('run_id', data[0].id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
