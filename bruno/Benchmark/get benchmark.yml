info:
  name: /v1/environments/:id/benchmarks/:id - Get a benchmark
  type: http
  seq: 3

http:
  method: GET
  url: "{{http_url}}/v1/environments/:environmentId/benchmarks/:benchmarkId"
  params:
    - name: environmentId
      value: "{{environment_id}}"
      type: path
    - name: benchmarkId
      value: "{{benchmark_id}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
