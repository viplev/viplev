info:
  name: /v1/environments/:id/benchmarks/:id - Update a benchmark
  type: http
  seq: 4

http:
  method: PUT
  url: "{{http_url}}/v1/environments/:environmentId/benchmarks/:benchmarkId"
  params:
    - name: environmentId
      value: "{{environment_id}}"
      type: path
    - name: benchmarkId
      value: "{{benchmark_id}}"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Updated Benchmark",
        "description": "Updated description"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
