info:
  name: /v1/environments/:id/benchmarks - Create benchmark
  type: http
  seq: 2

http:
  method: POST
  url: "{{http_url}}/v1/environments/:environmentId/benchmarks"
  params:
    - name: environmentId
      value: "{{environment_id}}"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "My Benchmark",
        "description": "A benchmark for testing"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let data = res.body;
        bru.setEnvVar('benchmark_id', data.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
