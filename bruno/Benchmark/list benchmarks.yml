info:
  name: /v1/environments/:id/benchmarks - Get all benchmarks
  type: http
  seq: 1

http:
  method: GET
  url: "{{http_url}}/v1/environments/:environmentId/benchmarks"
  params:
    - name: environmentId
      value: "{{environment_id}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let data = res.body;
        if (Array.isArray(data) && data.length > 0) {
          bru.setEnvVar('benchmark_id', data[0].id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
