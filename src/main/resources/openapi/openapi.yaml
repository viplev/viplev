openapi: 3.1.0
info:
  title: VIPLEV API
  description: Her skal være en beskrivelse.
  version: 0.0.1

tags:
  - name: Auth
    description: Auth related stuff



paths:

  /v1/auth/login:
    post:
      summary: Login
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginDTO'

components:
  schemas:
    LoginDTO:
      type: object
      required:
        - username
      properties:
        userId:
          type: string
          format: uuid
          readOnly: true
          examples:
            - "5a56d1ef-3ff9-475d-84c8-33796245fa9f"
        email:
          type: string
          examples:
            - "user@viplev.dk"
        password:
          type: string
          writeOnly: true
          examples:
            - "mySecretPassword"
        token:
          type: string
          readOnly: true
          examples:
            - "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWUsImlhdCI6MTUxNjIzOTAyMn0.KMUFsIDTnFmyG3nMiGM6H9FNFUROf3wh7SmqJp-QV30"


    ErrorDTO:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type
          examples:
            - /errors/bad-request
        title:
          type: string
          description: A short, human-readable description of the problem type
          examples:
            - Bad Request
        status:
          type: integer
          description: HTTP status code
          examples:
            - 400
        detail:
          type: string
          description: A detailed explanation of the problem
          examples:
            - The field 'name' is required
        instance:
          type: string
          format: uri
          description: URI reference identifying the specific occurrence of the problem
          examples:
            - /v1/environments/123